# Build the MkDocs site (from docs-src/) and deploy it to GitHub Pages via Actions.
# Runs on every push to main that touches the docs source or this workflow, and can
# also be triggered manually from the Actions tab.
name: Build and deploy docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs-src/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install MkDocs
        run: pip install -r docs-requirements.txt
      - name: Build site
        run: mkdocs build --strict
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # mkdocs.yml's site_dir is "docs" -- that's the built HTML output, not the
          # docs-src/ markdown source.
          path: 'docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
